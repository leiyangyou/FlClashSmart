name: release-android-arm64

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (defaults to v<version from pubspec.yaml>)'
        required: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.26.4'
  NDK_VERSION: r28c

jobs:
  release:
    name: Android arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE" | base64 --decode > android/app/keystore.jks
            store="$STORE_PASSWORD"; key="$KEY_PASSWORD"; alias="$KEY_ALIAS"
          else
            store="$(openssl rand -hex 16)"; key="$store"; alias=flclashsmart
            keytool -genkeypair -keystore android/app/keystore.jks -storetype JKS \
              -alias "$alias" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$store" -keypass "$key" \
              -dname "CN=FlClashSmart, OU=dev, O=dev, C=AU"
          fi
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$store" "$alias" "$key" >> android/local.properties

      - name: Build arm64 release APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --env stable --arch arm64 -v

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-release
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          tag="${INPUT_TAG:-v$version}"
          (cd dist && sha256sum ./*.apk > SHA256SUMS)
          args=(--title "$tag" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$tag" dist/*.apk dist/SHA256SUMS "${args[@]}"
